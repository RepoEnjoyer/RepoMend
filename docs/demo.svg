<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">RepoMend terminal repository health report</title>
  <desc id="desc">A dark terminal window with privacy, Git, dependency, workflow, and GitHub publishing findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071014"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13242a"/><stop offset="1" stop-color="#151a2a"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1160" cy="40" r="270" fill="#5eead4" opacity=".06"/>
  <circle cx="120" cy="740" r="250" fill="#818cf8" opacity=".07"/>
  <rect x="75" y="58" width="1250" height="642" rx="24" fill="#090f17" stroke="#2b3944" stroke-width="2" filter="url(#shadow)"/>
  <path d="M99 58h1202a24 24 0 0 1 24 24v55H75V82a24 24 0 0 1 24-24Z" fill="url(#bar)"/>
  <circle cx="117" cy="98" r="8" fill="#ff6b6b"/><circle cx="145" cy="98" r="8" fill="#ffd166"/><circle cx="173" cy="98" r="8" fill="#62d394"/>
  <text x="700" y="105" text-anchor="middle" fill="#8fa6b2" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">repomend doctor --online</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="120" y="185" fill="#f3f7f8" font-size="28" font-weight="700">RepoMend</text><text x="285" y="185" fill="#708792" font-size="20">· repository doctor</text>
    <text x="120" y="233" fill="#60e1c4" font-size="18" font-weight="700">PASS</text><text x="205" y="233" fill="#d9e5e9" font-size="18">Git email is privacy-protected</text><text x="1040" y="233" fill="#6e858f" font-size="16">privacy</text>
    <text x="120" y="281" fill="#60e1c4" font-size="18" font-weight="700">PASS</text><text x="205" y="281" fill="#d9e5e9" font-size="18">Locked dependency graph is consistent</text><text x="1040" y="281" fill="#6e858f" font-size="16">npm</text>
    <text x="120" y="329" fill="#60e1c4" font-size="18" font-weight="700">PASS</text><text x="205" y="329" fill="#d9e5e9" font-size="18">Workflow permissions are explicit</text><text x="1040" y="329" fill="#6e858f" font-size="16">actions</text>
    <text x="120" y="377" fill="#f4c95d" font-size="18" font-weight="700">WARN</text><text x="205" y="377" fill="#d9e5e9" font-size="18">Current branch has no upstream</text><text x="1040" y="377" fill="#6e858f" font-size="16">git</text>
    <text x="205" y="409" fill="#849aa4" font-size="15">Fix: git push --set-upstream origin &lt;branch&gt;</text>
    <text x="120" y="457" fill="#ff7b7b" font-size="18" font-weight="700">FAIL</text><text x="205" y="457" fill="#d9e5e9" font-size="18">Pages workflow exists but Pages is disabled</text><text x="1040" y="457" fill="#6e858f" font-size="16">github</text>
    <text x="205" y="489" fill="#849aa4" font-size="15">Fix: enable GitHub Actions as the Pages source</text>
    <line x1="120" y1="535" x2="1280" y2="535" stroke="#263640"/>
    <text x="120" y="585" fill="#f3f7f8" font-size="18">Summary</text><text x="235" y="585" fill="#ff7b7b" font-size="18">1 failed</text><text x="355" y="585" fill="#f4c95d" font-size="18">1 warning</text><text x="500" y="585" fill="#60e1c4" font-size="18">18 passed</text>
    <rect x="112" y="620" width="420" height="42" rx="12" fill="#17252a" stroke="#2f5d55"/><text x="137" y="648" fill="#8ce8d4" font-size="16" font-weight="700">Result: attention required</text>
  </g>
</svg>
