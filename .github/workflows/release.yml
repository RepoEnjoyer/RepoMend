name: Release package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in vMAJOR.MINOR.PATCH form
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  package:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'release: publish v1.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify release
        run: npm run check
      - name: Build release package
        run: npm pack
      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$DISPATCH_TAG" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1 }
            found && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            printf 'See CHANGELOG.md for release details.\n' > release-notes.md
          fi
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" repomend-*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" repomend-*.tgz \
              --target "$GITHUB_SHA" \
              --title "RepoMend $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
